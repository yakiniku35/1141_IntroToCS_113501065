<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JS1 Lab3 Guess Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }
    </style>

</head>
<body>
    <h1> 113501065_Number Guessing Game </h1>

    <div id="result">
        <img src="/Lab3_GuessNum/images/correct.jpg" alt="correct Guess" width="300">
        <img src="/Lab3_GuessNum/images/wrong.jpg" alt="wrong Guess" width="300">
        
    </div>

    <script>
        var answer = Math.floor(Math.random() * 100) + 1;
        var chances = 7;
        var guess_num;
        var min = 1;
        var max = 100;
        guess_num = window.prompt('Guess a number between ' + min + ' and ' + max + ', You have ' + chances + ' chances left:');

        while (guess_num != answer) {

            // 根據猜測結果更新可猜範圍
            if (guess_num < answer) {
                alert('Your guess is too low. Try again.');
                min = guess_num;   // 更新最小可能值
            } 
            else if (guess_num > answer) {
                alert('Your guess is too high. Try again.');
                max = guess_num;   // 更新最大可能值
            }

            chances--;

            if (chances == 0) {
                alert('Sorry, you ran out of chances. The number was ' + answer + '.');
                break;
            }

            guess_num = window.prompt(
                'Guess a number between ' + min + ' and ' + max +
                '. You have ' + chances + ' chances left:'
            );
        }


        if (guess_num == answer) {
            alert('You guessed the number in ' + chances + ' chances.<br>');
            document.getElementById('result').innerHTML = '<img src="/Lab3_GuessNum/images/correct.jpg" alt="correct Guess" width="300">';
        }
        else {
            alert('Sorry, the number was ' + answer + '.<br>');
            document.getElementById('result').innerHTML = '<img src="/Lab3_GuessNum/images/wrong.jpg" alt="wrong Guess" width="300">';
        }

    </script>
</body>
</html>
