<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Statistics</title>
    <link rel="stylesheet" href="113501065_JS2_HW8.css">
</head>
<body>
    <h1>113501065 JS Calculator</h1>
    
    <!-- Math 1,2 -->
    <h2>Number 1</h2>
    <div class="input-area">
        <input type="number" id="math1Input" placeholder="Number 1">
    </div>

    <h2>Number 2</h2>
    <div class="input-area">
        <input type="number" id="math2Input" placeholder="Number 2">
    </div>

    <h2>Operate Way?</h2>
    <div class="select-area">
        <select name="operation" id="operationSelect">
            <option value="add" selected>+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
    </div>

    <!-- 這個按鈕要跟上面的選項聯動，還沒實作完畢 -->
    <div class="button-area">
        <button id="calculateButton">Calculate</button>
    </div>

    <div class="result-area">
        <h2 id="resultDisplay">Result = </h2>
    </div>


    <script src="113501065_JS2_HW8.js"></script>
</body>
</html>
