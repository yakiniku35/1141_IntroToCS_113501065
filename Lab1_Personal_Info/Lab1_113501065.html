<!DOCTYPE html>
<html lang="en" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>
        Lab1_113501065
    </title>
    <style>
        body {
            font-family: "Times New Roman", serif;
        }
        table {
        margin-left: 20px;
        }

        td {
            padding-left: 10px; 
            text-align: left;   
        }

        input, select, textarea {
            margin-left: 0;     
        }
    </style>
</head>
<body>
    <form>
        <h2>
            About me -- 113501065
        </h2>
        <table border="1" style="margin-left:10px;">
            <tr>
                <th colspan="5" style="height: 30px;">
                    About -- 113501065
                </th>
            </tr>
            <tr>
                <td colspan="1" rowspan="3">
                    <img src="my-notion-face-transparent.jpg" alt="personal photo" width="120" height="120">
                    <p style="text-align: center;">
                        personal photo
                    </p>
                </td>
                <td colspan="4" height="70">
                    <label for="username">
                        Name:
                    </label>
                    <input type="text" id="username" name="username"><br>
                    <label for="gender">
                        Gender:
                    </label>
                    <input type="radio" name="gender" value="Male" checked>Male
                    <input type="radio" name="gender" value="Female">Female
                    <input type="radio" name="gender" value="Other">Other
                </td>
            </tr>
            <tr>
                <td colspan="3" height="40">
                    <!-- nationality here --> County:
                     <select name="county">
                        <option value="Taipei" selected>Taipei</option>
                        <option value="Tainan">Tainan</option>
                        <option value="Taichung">Taichung</option>
                        <option value="Taoyuan">Taoyuan</option>
                    </select>
                </td>
                <td colspan="2">
                    <!-- birthday here --> 
                     <label for="birthday">
                        Birthday:
                    </label>
                    <input type="date" id="birthday" name="birthday" min="1900-01-01" max="2030-12-31">
                </td>
            </tr>
            <tr>
                <td colspan="4">
                    <!-- email here --> Email:
                    <input type="email" name="email" required>

                </td>
            </tr>
            <tr>
                <td>
                    Hobby
                </td>
                <td colspan="4">
                    <!-- hobby here --> 
                     <input type="checkbox" name="hobby" value="Swimming"> Swimming
                     <input type="checkbox" name="hobby" value="Volleyball"> Volleyball
                     <input type="checkbox" name="hobby" value="Movie"> Movie
                     <input type="checkbox" name="hobby" value="Game"> Game
                     <input type="checkbox" name="hobby" value="sleep"> sleep
                </td>
            </tr>
            <tr>
                <td>
                    Skill
                </td>
                <td colspan="4">
                    <!-- skill here --> 
                     <input type="checkbox" name="skill" value="Java"> Java
                     <input type="checkbox" name="skill" value="HTML"> HTML
                     <input type="checkbox" name="skill" value="Python"> Python
                     <input type="checkbox" name="skill" value="Microsoft Office"> Microsoft Office
                     <input type="checkbox" name="skill" value="Premiere"> Premiere
                </td>
            </tr>
            <tr>
                <td style="text-align: center;">
                    Say Something
                </td>
                <td colspan="4">
                    <!-- say something here -->
                     <textarea rows="1" cols="20" placeholder="Say something here."></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="5" height="40">
                    <input type="submit" value="提交">
                    <input type="reset" value="重設">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
