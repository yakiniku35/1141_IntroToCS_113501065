<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: rgb(240, 240, 240);
        }
    </style>
	<title>Button</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="button-container">
            <input type="button" id="Button1" value="1 button" onclick="
            alert('you clicked button 1');">
    </div>

    <div class="button-container">
            <input type="button" id="Button2" value="2 button" onclick="
            alert('change background color');
            document.body.style.backgroundColor = 'rgb(200, 200, 255)' ;">
    </div>

    <div class="button-container">
            <input type="button" id="Button3" value="3 button" onclick="
            alert('reset background color');
            document.body.style.backgroundColor = 'rgb(240, 240, 240)' ;">
    </div>

    <div class="button-container">
            <input type="button" id="Button4" value="4 button" onclick="
            alert('current date:'+ Date())">
    </div>

    <script>
        alert('current date:'+ Date())
    </script>

    <script>
        var name;
        name = window.prompt('enter your name:');

        document.writeln("<h1> Hello " + name + "! AND Welcome to HELL! </h1>");
        alert('current date:'+ Date());
    
    </script>
