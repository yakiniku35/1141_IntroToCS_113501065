<!DOCTYPE html>
<html>

<form action="#">
    <input id="rollButton" type="button" value="Roll the Dice">
</form>

<form action="#">
    <input id="startButton" type="button" value="Start Rolling">
    <input id="stopButton" type="button" value="Stop">
</form>


<!-- 100 顆骰子 -->
<div id="diceArea">
    <!-- 建議：實務可用 JS 自動產生，但既然你給了，我就不動 -->
    <!-- 以下略，保持你原本的 100 顆 <img> -->
    <!-- ... -->
    <!-- 你原本的 die1 ～ die100 全部保留 -->
</div>

<div id="result"></div>


<script>
    let dice = [];
    let counts = [0, 0, 0, 0, 0, 0];
    let totalRolls = 0;
    let rolling = null;

    function start() {

        // 取得 100 顆骰子
        for (let i = 1; i <= 100; i++) {
            dice.push(document.getElementById("die" + i));
        }

        document.getElementById("startButton").addEventListener("click", startRolling);
        document.getElementById("stopButton").addEventListener("click", stopRolling);
        document.getElementById("rollButton").addEventListener("click", rollOnce);
    }

    // 單次按鈕（Roll the Dice）
    function rollOnce() {
        rollDice();
        showResults();
    }

    // 連續擲
    function startRolling() {
        if (rolling !== null) return;
        rolling = setInterval(() => {
            rollDice();
            showResults();
        }, 50);
    }

    function stopRolling() {
        clearInterval(rolling);
        rolling = null;
    }

    function rollDice() {
        dice.forEach(die => {
            let value = setImage(die);
            counts[value - 1]++;
            totalRolls++;
        });
    }

    function setImage(die) {
        let value = Math.floor(Math.random() * 6) + 1;
        die.setAttribute("src", "dice/die" + value + ".png");
        die.setAttribute("alt", "die" + value);
        return value;
    }

    function showResults() {
        let resultDiv = document.getElementById("result");

        let html = "<h3>Dice Statistics</h3>";
        html += "<table border='1' cellpadding='5'><tr><th>Face</th><th>Frequency</th><th>Percentage</th></tr>";

        for (let i = 1; i <= 6; i++) {
            let freq = counts[i - 1];
            let percent = totalRolls > 0 ? ((freq / totalRolls) * 100).toFixed(2) : 0;

            html += `<tr>
                        <td>${i}</td>
                        <td>${freq}</td>
                        <td>${percent}%</td>
                    </tr>`;
        }
        html += "</table>";

        // 🎯 你要的平均值 (Σ frequency*face / totalRolls)
        let sum = 0;
        for (let i = 1; i <= 6; i++) {
            sum += counts[i - 1] * i;
        }
        let average = totalRolls > 0 ? (sum / totalRolls).toFixed(4) : 0;

        html += `<p><b>Average = ${average}</b></p>`;

        resultDiv.innerHTML = html;
    }

    window.onload = start;
</script>

</html>
