<div id="result"></div>

<h3>Average Occurrence Chart</h3>
<canvas id="avgChart" width="400" height="200"></canvas>


<script>
    var dice = [];
    let counts = [0, 0, 0, 0, 0, 0];
    let totalRolls = 0;
    let rolling = null;

    //平均數出現次數
    let averageCounts = {}; 

    function start() {
        for (let i = 1; i <= 200; i++) {
            dice.push(document.getElementById("die" + i));
        }

        document.getElementById("startButton").addEventListener("click", startRolling);
        document.getElementById("stopButton").addEventListener("click", stopRolling);
        document.getElementById("rollButton").addEventListener("click", rollDice);
    }

    function startRolling() {
        if (rolling !== null) return;

        rolling = setInterval(() => {
            rollDice();
        }, 20);
    }

    function stopRolling() {
        clearInterval(rolling);
        rolling = null;
    }

    function rollDice() {
        dice.forEach(die => {
            let value = setImage(die);
            counts[value - 1]++;
            totalRolls++;
        });

        showResults();
        showAverageStats();
    }

    function setImage(die) {
        let value = Math.floor(Math.random() * 6) + 1;
        die.setAttribute("src", "dice/die" + value + ".png");
        die.setAttribute("alt", "die" + value);
        return value;
    }

    function showResults() {
        let resultDiv = document.getElementById("result");

        let html = "<h3>Dice Statistics</h3>";
        html += "<table border='1' cellpadding='5'><tr><th>Face</th><th>Frequency</th><th>Percentage</th></tr>";

        for (let i = 1; i <= 6; i++) {
            let freq = counts[i - 1];
            let percent = totalRolls > 0 ? ((freq / totalRolls) * 100).toFixed(2) : 0;

            html += `<tr>
                        <td>${i}</td>
                        <td>${freq}</td>
                        <td>${percent}%</td>
                     </tr>`;
        }

        html += "</table>";

        resultDiv.innerHTML = html;
    }

    function showAverageStats() {
        let sum = 0;
        for (let i = 1; i <= 6; i++) {
            sum += counts[i - 1] * i;
        }

        let avg = totalRolls > 0 ? (sum / totalRolls).toFixed(3) : 0;

        //紀錄平均數出現次數
        if (!averageCounts[avg]) {
            averageCounts[avg] = 0;
        }
        averageCounts[avg]++;

        updateChart();
    }

    // 長條圖
    let avgChart = null;

    function updateChart() {
        let ctx = document.getElementById("avgChart").getContext("2d");

        let keys = Object.keys(averageCounts).sort((a, b) => parseFloat(a) - parseFloat(b));
        let values = keys.map(k => averageCounts[k]);

        if (avgChart !== null) {
            avgChart.destroy();
        }

        avgChart = new Chart(ctx, {
            type: "bar",
            data: {
                labels: keys,
                datasets: [{
                    label: "Average Frequency",
                    data: values,
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }

    window.onload = start;
</script>
