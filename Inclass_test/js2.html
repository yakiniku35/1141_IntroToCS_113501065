<div id="result"></div>
<div id="averageStats"></div>

<script>
    let dice = [];
    let counts = [0, 0, 0, 0, 0, 0];
    let totalRolls = 0;
    let rolling = null;
    let averageCounts = {}; // 用來記錄每次平均數出現的次數

    function start() {
        // 取得 100 顆骰子
        for (let i = 1; i <= 100; i++) {
            dice.push(document.getElementById("die" + i));
        }

        document.getElementById("startButton").addEventListener("click", startRolling);
        document.getElementById("stopButton").addEventListener("click", stopRolling);
        document.getElementById("rollButton").addEventListener("click", rollOnce);
    }

    function rollOnce() {
        rollDice();
        showResults();
        showAverageStats();
    }

    function startRolling() {
        if (rolling !== null) return;
        rolling = setInterval(() => {
            rollDice();
            showResults();
            showAverageStats();
        }, 50);
    }

    function stopRolling() {
        clearInterval(rolling);
        rolling = null;
    }

    function rollDice() {
        dice.forEach(die => {
            let value = setImage(die);
            counts[value - 1]++;
            totalRolls++;
        });
    }

    function setImage(die) {
        let value = Math.floor(Math.random() * 6) + 1;
        die.setAttribute("src", "dice/die" + value + ".png");
        die.setAttribute("alt", "die" + value);
        return value;
    }

    function showResults() {
        let resultDiv = document.getElementById("result");

        let html = "<h3>Dice Statistics</h3>";
        html += "<table border='1' cellpadding='5'><tr><th>Face</th><th>Frequency</th><th>Percentage</th></tr>";

        for (let i = 1; i <= 6; i++) {
            let freq = counts[i - 1];
            let percent = totalRolls > 0 ? ((freq / totalRolls) * 100).toFixed(2) : 0;

            html += `<tr>
                        <td>${i}</td>
                        <td>${freq}</td>
                        <td>${percent}%</td>
                    </tr>`;
        }

        // 平均值
        let sum = 0;
        for (let i = 1; i <= 6; i++) {
            sum += counts[i - 1] * i;
        }
        let average = totalRolls > 0 ? (sum / totalRolls).toFixed(2) : 0;
        html += `<tr><td colspan="3"><b>Current Average = ${average}</b></td></tr>`;

        resultDiv.innerHTML = html;

        // 累計平均數出現次數
        if (average !== 0) {
            if (!averageCounts[average]) averageCounts[average] = 0;
            averageCounts[average]++;
        }
    }

    function showAverageStats() {
        let avgDiv = document.getElementById("averageStats");

        let html = "<h3>Average Number Frequency</h3>";
        html += "<table border='1' cellpadding='5'><tr><th>Average</th><th>Frequency</th></tr>";

        let sortedKeys = Object.keys(averageCounts).sort((a, b) => parseFloat(a) - parseFloat(b));
        sortedKeys.forEach(avg => {
            html += `<tr><td>${avg}</td><td>${averageCounts[avg]}</td></tr>`;
        });

        html += "</table>";
        avgDiv.innerHTML = html;
    }

    window.onload = start;
</script>
